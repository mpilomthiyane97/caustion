services:
  - type: web
    name: caution-sa-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: DELIVERY_FEE_CENTS
        value: 0
      - key: ADMIN_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: SELF_PING_URL
        sync: false
